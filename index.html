<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hold'em Friends — Private Play-Chip Poker</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>♠ Hold'em Friends</h1><p>Private heads-up Texas Hold'em · Play chips only · No bots · No ads</p></header><section id="lobby" class="panel"><h2>Join the table</h2><label>Your name <input id="name" maxlength="22" placeholder="Your nickname"></label><div class="buttons"><button id="create">Create private table</button></div><div class="join"><input id="roomInput" maxlength="8" placeholder="Room code"><button id="join">Join friend's table</button></div><p class="muted">Share the room link with one friend. Two human players only.</p></section><section id="game" hidden><div class="top"><span id="roomLabel"></span><button class="secondary" id="copy">Copy invite link</button></div><div class="table"><div id="opponent" class="player"></div><div class="felt"><div id="board" class="cards"></div><div id="pot" class="pot"></div><div id="stage"></div></div><div id="self" class="player"></div></div><div id="status" class="status"></div><div class="controls" id="controls"><button id="fold">Fold</button><button id="check">Check</button><button id="call">Call</button><div class="raise"><label>Raise to (total this street)<input id="raiseAmount" type="number" min="1" step="1"></label><button id="raise">Raise / All-in</button></div></div><button id="start" class="start" hidden>Deal next hand</button><details open><summary>Hand history</summary><ol id="history"></ol></details></section><div id="notice" role="status"></div><footer>For entertainment only. No deposits, withdrawals, real-money bets, or prizes. Server restarts reset rooms.</footer></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
